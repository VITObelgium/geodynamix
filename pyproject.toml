[build-system]
requires      = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "geodynamix"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Rust",
]
dynamic = ["version"]
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]
docs = ["sphinx"]
all  = ["my_project[docs]", "my_project[test]"]

[tool.maturin]
module-name   = "geodynamix"
python-source = "python"
profile       = "release"
features      = ["static_build"]
bindings      = "pyo3"
manifest-path = "Cargo.toml"
strip         = true
data          = "python/geodynamix.data"

[tool.pixi.project]
channels  = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.tasks]
test      = "pytest -s tests/*.py"
dev_wheel = "maturin develop"
wheel     = "maturin build"

[tool.pixi.build-dependencies]
maturin = ">=1.8.1,<2"
pytest  = ">=8.3.4,<9"
pip     = ">=25.0,<26"

[tool.pixi.feature.docs]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.feature.docs.tasks]
docs     = "sphinx-build -M html doc target/pydoc"
livedocs = "sphinx-autobuild -M html doc target/pydoc"

# Put it first so that "make" without argument is like "make help".
# Catch-all target: route all unknown targets to Sphinx using the new
# "make mode" option.  $(O) is meant as a shortcut for $(SPHINXOPTS).
[tool.pixi.feature.docs.dependencies]
sphinx           = "*"
furo             = ">=2024.8.6,<2025"
sphinx-autobuild = ">=2024.10.3,<2025"
sphinx-design    = ">=0.6.1,<0.7"

[tool.pixi.dependencies]
numpy = ">=2.2.2,<3"

[tool.pixi.environments]
docs = ["docs"]
