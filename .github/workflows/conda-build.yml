name: Conda build
on: [push]

jobs:
    build:
        name: ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        env:
            GIT_HASH: ${{ github.sha }}
            GDX_VERSION: 0.14.4
        strategy:
            fail-fast: false
            matrix:
                os: ["ubuntu-latest", "windows-2022"]
        steps:
            - name: Clone repository
              uses: actions/checkout@v6
              with:
                  submodules: true
            - uses: prefix-dev/setup-pixi@v0.9.4
              with:
                  frozen: true
            - uses: extractions/setup-just@v4
            - name: Build conda package
              run: just pixi_build
