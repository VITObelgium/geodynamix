name: Vcpkg build

on: [push]

jobs:
    build:
        name: ${{ matrix.cfg.os }}
        runs-on: ${{ matrix.cfg.os }}
        strategy:
            fail-fast: false
            matrix:
                cfg:
                    - { os: ubuntu-latest, triplet: x64-linux }
                    - { os: windows-2022, triplet: x64-windows-static-vs2022 }
                    - { os: macos-13, triplet: x64-osx }

        steps:
            - name: Clone repository
              uses: actions/checkout@v4
              with:
                  submodules: true
            - name: Export GitHub Actions cache environment variables
              uses: actions/github-script@v7
              with:
                  script: |
                      core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
                      core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            - uses: taiki-e/install-action@v2
              with:
                tool: just
            - name: Set up Python
              uses: actions/setup-python@v5
              id: setup-python
              with:
                  python-version: "3.x"
            - name: Install pip dependencies
              run: |
                  python3 -m pip install --upgrade pip
                  pip3 install numpy
            - name: Install linux dependencies
              if: ${{ matrix.cfg.os == 'ubuntu-latest' }}
              run: sudo apt-get install nasm openssl ninja-build
            - name: Install osx dependencies
              if: ${{ matrix.cfg.os == 'macos-latest' }}
              run: brew install nasm ninja
            - name: Bootstrap the ports
              working-directory: ./cpp
              run: just bootstrap
              env:
                  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
            - name: Build the code
              working-directory: ./cpp
              run: just build
            - name: Run the unit tests
              working-directory: ./cpp
              run: just test
