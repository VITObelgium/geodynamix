name: Vcpkg build

on: [push]

jobs:
    build:
        name: ${{ matrix.cfg.os }}
        runs-on: ${{ matrix.cfg.os }}
        strategy:
            fail-fast: false
            matrix:
                cfg:
                    - { os: windows-2022, triplet: x64-windows-static }

        steps:
            - name: Install just
              uses: extractions/setup-just@v4
            - name: Clone repository
              uses: actions/checkout@v6
              with:
                  submodules: true
            - name: Set up Python
              uses: actions/setup-python@v6
              id: setup-python
              with:
                  python-version: "3.x"
            - name: Install pip dependencies
              env:
                  PYTHON_EXECUTABLE: ${{ steps.setup-python.outputs.python-path }}
              run: |
                  & $env:PYTHON_EXECUTABLE -m pip install --upgrade pip
                  & $env:PYTHON_EXECUTABLE -m pip install numpy
            - name: Install linux dependencies
              if: ${{ matrix.cfg.os == 'ubuntu-latest' }}
              run: sudo apt-get install nasm openssl ninja-build
            - name: Setup MSVC environment
              if: ${{ matrix.cfg.os == 'windows-2022' }}
              uses: TheMrMilchmann/setup-msvc-dev@v4
              with:
                  arch: x64
            - name: Install osx dependencies
              if: ${{ matrix.cfg.os == 'macos-latest' }}
              run: brew install nasm ninja
            - name: Cache vcpkg binary
              id: cache-vcpkg-bin
              uses: actions/cache@v5
              with:
                  path: |
                      deps/vcpkg/vcpkg
                      deps/vcpkg/vcpkg.exe
                  key: ${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
            - name: Cache vcpkg packages
              id: cache-vcpkg
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.cache/vcpkg
                      ~/AppData/Local/vcpkg/archives
                  key: ${{ runner.os }}-${{ matrix.cfg.triplet }}-${{ hashFiles('vcpkg.json', '.git/modules/deps/vcpkg/shallow') }}
            - name: Bootstrap vcpkg
              run: just bootstrap_vcpkg
            - name: Bootstrap the ports
              run: just bootstrap ${{ matrix.cfg.triplet }}
            - name: Configure with setup-python
              env:
                  PYTHON_EXECUTABLE: ${{ steps.setup-python.outputs.python-path }}
              run: |
                  $pythonRoot = Split-Path -Parent $env:PYTHON_EXECUTABLE
                  cmake --fresh --preset ${{ matrix.cfg.triplet }} "-DPython3_EXECUTABLE=$env:PYTHON_EXECUTABLE" "-DPython3_ROOT_DIR=$pythonRoot"
            - name: Build the code
              run: just build ${{ matrix.cfg.triplet }}
            - name: Run the tests
              run: just test ${{ matrix.cfg.triplet }}
